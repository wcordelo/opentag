# OpenTag edge CI — Claude Tag bot spine only.
# Does NOT deploy, migrate DBs, push Slack messages, or create PRs.
name: edge-ci

on:
  push:
    paths:
      - "edge/**"
      - "infra/supermemory/**"
      - "docs/KNOWLEDGE-BASE-SPEC.md"
      - "docs/supermemory-cloudflare-migration.md"
      - "docs/graphify-local-mcp.md"
      - "docs/operations.md"
      - "PRODUCT.md"
      - ".github/workflows/edge-ci.yml"
  pull_request:
    paths:
      - "edge/**"
      - "infra/supermemory/**"
      - "docs/KNOWLEDGE-BASE-SPEC.md"
      - "docs/supermemory-cloudflare-migration.md"
      - "docs/graphify-local-mcp.md"
      - "docs/operations.md"
      - "PRODUCT.md"
      - ".github/workflows/edge-ci.yml"

jobs:
  bot-spine:
    name: bot-spine (typecheck + unit + StateStore/Graphify e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:e2e:graphify
      - run: npm run test:graphify-policy
      - run: npm run check:knowledge-rollout
      - run: npm ci --prefix workers/supermemory
      - run: npm ci --prefix workers/graphify
      - run: npm --prefix workers/supermemory run typecheck
      - run: npm --prefix workers/graphify run typecheck
      - run: npm run validate:deploy-config
