name = "opentag-credential-broker"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The broker reads public credential metadata from the single platform ledger
# owned by opentag-bot. It never gets a second copy of tenant state.
[[durable_objects.bindings]]
name = "PLATFORM_STATE"
class_name = "PlatformStateDO"
script_name = "opentag-bot"

[vars]
ENVIRONMENT = "production"

# Secrets:
# - BROKER_AUTH_TOKEN authenticates the opentag-bot service binding.
# - The CUSTODY service binding is intentionally omitted until an approved
#   external KMS/envelope custody Worker exists. Do not add provider tokens.
