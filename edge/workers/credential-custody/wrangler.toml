name = "opentag-credential-custody"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Revalidate the authoritative access bundle before reading custody metadata.
[[durable_objects.bindings]]
name = "WORKSPACE_CONFIG"
class_name = "WorkspaceConfigDO"
script_name = "opentag-bot"

# Read credential status and expiry from the platform ledger; never trust the
# request body's credential metadata block.
[[durable_objects.bindings]]
name = "PLATFORM_STATE"
class_name = "PlatformStateDO"
script_name = "opentag-bot"

[vars]
ENVIRONMENT = "production"
CUSTODY_BINDINGS_JSON = '[{"ref":"credential:linear:controlled","version":1,"binding":"LINEAR_CONTROLLED_API_KEY","expiresAt":"2026-08-31T23:59:59.000Z"}]'

[[secrets_store_secrets]]
binding = "LINEAR_CONTROLLED_API_KEY"
store_id = "d27d5fd480784b1d9172df3442e8ed30"
secret_name = "LINEAR_CONTROLLED_API_KEY"

# CUSTODY_BINDINGS_JSON is metadata only. It maps a credential reference and
# version to a Secrets Store binding name plus a bounded expiry. Configure it
# through an approved deployment overlay; never put a provider token here.
#
# Each enabled credential also needs a [[secrets_store_secrets]] entry:
# binding = "GOOGLE_DRIVE_TOKEN_V2"
# store_id = "<approved-store-id>"
# secret_name = "<approved-secret-name>"
#
# Secret: CUSTODY_AUTH_TOKEN. It must be shared only with the broker's CUSTODY
# service binding. No provider token is stored as a Worker secret.
