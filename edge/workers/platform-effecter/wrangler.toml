name = "opentag-platform-effecter"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[queues.producers]]
binding = "PLATFORM_EFFECTS_QUEUE"
queue = "opentag-platform-effects"

# This is a cross-Worker namespace binding to the metadata ledger owned by the
# bot Worker. The effecter never gets a second copy of platform state.
[[durable_objects.bindings]]
name = "PLATFORM_STATE"
class_name = "PlatformStateDO"
script_name = "opentag-bot"

[vars]
ENVIRONMENT = "production"

# Secret: EFFECTOR_AUTH_TOKEN. Do not put provider credentials in this Worker.
# Provider-specific adapters and their custody bindings are separate, explicit
# deployment decisions; no adapter is registered by this baseline Worker.
# Enable exactly the effect-family bindings approved by custody and compliance
# review. Each service binding has a distinct bearer secret; never reuse one
# provider binding for multiple effect families.
# [[services]]
# binding = "CREDENTIAL_CUSTODY_EFFECT_ADAPTER"
# service = "opentag-credential-provider-adapter"
# Secret: CREDENTIAL_CUSTODY_EFFECT_ADAPTER_AUTH_TOKEN
# [[services]]
# binding = "CONNECTOR_OAUTH_EFFECT_ADAPTER"
# service = "opentag-oauth-provider-adapter"
# Secret: CONNECTOR_OAUTH_EFFECT_ADAPTER_AUTH_TOKEN
# The existing connector-effect provider is isolated under its own binding.
[[services]]
binding = "CONNECTOR_EFFECT_ADAPTER"
service = "opentag-platform-provider-adapter"
# Secret: CONNECTOR_EFFECT_ADAPTER_AUTH_TOKEN
# Add the same explicit pair for provisioning, identity custody, marketplace,
# billing meter, or memory deletion only after each provider boundary is
# separately approved.
