# Production Claude Tag bot spine (clean DO migration history).
# Local `wrangler.toml` keeps name "opentag-edge" for dev; this config deploys
# as opentag-bot to avoid the legacy ThreadDurableObject migration conflict.
name = "opentag-bot"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[analytics_engine_datasets]]
binding = "DELIVERY_METRICS"
dataset = "opentag_delivery"

[[durable_objects.bindings]]
name = "BOT_STATE"
class_name = "ConversationStateDO"

[[durable_objects.bindings]]
name = "WORKSPACE_CONFIG"
class_name = "WorkspaceConfigDO"

[[durable_objects.bindings]]
name = "KNOWLEDGE"
class_name = "KnowledgeDO"

# Per-thread session event log (SPEC.md §3.2/§4.1) — replay source for the
# render-obligation alarm fallback in ConversationStateDO.
[[durable_objects.bindings]]
name = "SESSION_EVENTS"
class_name = "SessionEventDO"

[[durable_objects.bindings]]
name = "DEFERRED_INGRESS"
class_name = "DeferredIngressDO"

[[durable_objects.bindings]]
name = "SLACK_RATE_LIMIT"
class_name = "SlackRateLimitDO"

[[durable_objects.bindings]]
name = "PLATFORM_STATE"
class_name = "PlatformStateDO"

[[durable_objects.bindings]]
name = "ROUTER_MEASUREMENTS"
class_name = "RouterMeasurementDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationStateDO", "WorkspaceConfigDO", "KnowledgeDO"]

[[migrations]]
tag = "v2-session-events"
new_sqlite_classes = ["SessionEventDO"]

[[migrations]]
tag = "v3-durable-ingress-rate-limit"
new_sqlite_classes = ["DeferredIngressDO", "SlackRateLimitDO"]

[[migrations]]
tag = "v4-platform-state"
new_sqlite_classes = ["PlatformStateDO"]

[[migrations]]
tag = "v5-router-measurements"
new_sqlite_classes = ["RouterMeasurementDO"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "opentag-research-blobs"

[[services]]
binding = "RESEARCH_TASKS"
service = "opentag-orchestrator"

[[services]]
binding = "BOT_SELF"
service = "opentag-bot"

# Knowledge Queue/DLQ — C1 approved 2026-07-28 for connected E2E with Railway Local.
[[queues.producers]]
binding = "KNOWLEDGE_QUEUE"
queue = "opentag-knowledge"

[[queues.consumers]]
queue = "opentag-knowledge"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "opentag-knowledge-dlq"

[[queues.consumers]]
queue = "opentag-knowledge-dlq"
max_batch_size = 5
max_retries = 3

# Worker→Worker must use a service binding — public workers.dev fetch returns 1042
# on the same zone. HttpAgent still needs AGENT_URL for the Request path/URL.
[[services]]
binding = "AGENT_RUNTIME"
service = "opentag-agent"

# Claude Code harness container (GOAL.md Phase A5, SPEC.md §3.6/§4.4). The
# target Worker + image deploy separately from edge/workers/sandbox/ and must
# exist before this bot service binding is deployed.
[[services]]
binding = "HARNESS"
service = "opentag-harness"

# Deploy opentag-credential-broker before activating connector credentials.
# The broker remains fail-closed until its external CUSTODY binding is
# configured; this binding never carries a provider token.
[[services]]
binding = "CONNECTOR_CREDENTIALS"
service = "opentag-credential-broker"

# Metadata-only platform-effect wakeups. The queue body contains only an
# internal PlatformStateDO object name; provider payloads and secrets never
# enter this queue.
[[queues.producers]]
binding = "PLATFORM_EFFECTS_QUEUE"
queue = "opentag-platform-effects"

[[queues.consumers]]
queue = "opentag-platform-effects"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "opentag-platform-effects-dlq"

[[queues.consumers]]
queue = "opentag-platform-effects-dlq"
max_batch_size = 10
max_retries = 3

# Separately deploy the authenticated effecter before enabling production
# dispatch. Its provider adapters remain independently fail-closed.
[[services]]
binding = "PLATFORM_EFFECTER"
service = "opentag-platform-effecter"

[vars]
ENVIRONMENT = "production"
NANOCODEX_NATIVE_RESPONSES = "true"
HARNESS_REPO_URL = "https://github.com/wcordelo/opentag"
KNOWLEDGE_QUEUE_NAME = "opentag-knowledge"
KNOWLEDGE_DLQ_NAME = "opentag-knowledge-dlq"
PLATFORM_EFFECTS_QUEUE_NAME = "opentag-platform-effects"
# Pin the production bot identity so self-authored Slack messages are rejected
# before auth.test completes (and even when that best-effort lookup fails).
SLACK_BOT_USER_ID = "U0BAK4AJ2Q1"
# Trusted rich-payload triggers remain disabled until actors are configured.
# SLACK_TRUSTED_TRIGGER_ACTORS = "bot:B0123456789,app:A0123456789"
# AGENT_URL: https://opentag-agent.<account>.workers.dev/api/copilotkit/agent/triage/run
# (path used by HttpAgent; traffic goes through AGENT_RUNTIME service binding)
# Source lifecycle issuance stays external and the verifier stays disabled
# until C1/S1 approves an exact authority/key. Configure only the Ed25519
# public key, issuer, and key id then; never add a private signing key:
# KNOWLEDGE_SOURCE_AUTH_PUBLIC_KEY, KNOWLEDGE_SOURCE_AUTH_ISSUER,
# KNOWLEDGE_SOURCE_AUTH_KEY_ID.
# P1 backfill approval issuance is likewise external and disabled. Configure
# only the approved Ed25519 verifier tuple after P1 authority selection:
# KNOWLEDGE_BACKFILL_APPROVAL_PUBLIC_KEY,
# KNOWLEDGE_BACKFILL_APPROVAL_ISSUER,
# KNOWLEDGE_BACKFILL_APPROVAL_KEY_ID. The Worker must never hold its private key.

# Secrets: SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, AGENT_URL,
# ADMIN_SECRET, INTERNAL_SECRET, KNOWLEDGE_ACTOR_TOKEN_SECRET,
# SUPERMEMORY_API_KEY, CONNECTOR_CREDENTIAL_BROKER_TOKEN
# SUPERMEMORY_URL is a deploy-time non-secret var; configure it through
# OPENTAG_VAR_SUPERMEMORY_URL in scripts/deploy-opentag.mjs.
#
# Harness container (Phase A5). The active HARNESS service binding above means
# opentag-harness must be deployed before this bot config:
# HARNESS_URL = "https://opentag-harness.<account>.workers.dev"  (fallback when no HARNESS binding)
# HARNESS_REPO_URL = "https://github.com/<org>/<default-repo>"   (optional default clone target)
# HARNESS_AUTH_TOKEN is a secret: `wrangler secret put HARNESS_AUTH_TOKEN --config wrangler.bot.toml`
# EFFECTOR_AUTH_TOKEN is a secret shared with opentag-platform-effecter:
# `wrangler secret put EFFECTOR_AUTH_TOKEN --config wrangler.bot.toml`
